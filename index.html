<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020308">

<title>SMITHX — Global Logistics</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#020308;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* =========================
   NAVIGATION
========================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 6%;
    background:rgba(2,3,8,.55);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:4px;
}

.logo span{
    color:#4da3ff;
}

.nav-btn{
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.05);
    color:white;
    padding:10px 18px;
    border-radius:30px;
    cursor:pointer;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    padding:120px 7% 70px;
}

.space{
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 75% 50%,rgba(0,110,255,.16),transparent 30%),
      radial-gradient(circle at 20% 20%,rgba(0,170,255,.08),transparent 25%),
      #020308;
}

.stars{
    position:absolute;
    inset:0;
    opacity:.8;
    background-image:
      radial-gradient(circle,#fff 1px,transparent 1px),
      radial-gradient(circle,#fff .7px,transparent .7px);
    background-size:110px 110px,170px 170px;
    background-position:20px 30px,70px 100px;
    animation:stars 40s linear infinite;
}

@keyframes stars{
    from{transform:translateY(0)}
    to{transform:translateY(-110px)}
}

.hero-content{
    width:48%;
    position:relative;
    z-index:10;
}

.eyebrow{
    color:#61b1ff;
    letter-spacing:4px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:18px;
}

h1{
    font-size:clamp(48px,7vw,100px);
    line-height:.9;
    letter-spacing:-5px;
    margin-bottom:28px;
}

h1 span{
    color:#5caeff;
}

.hero p{
    color:#aeb8c9;
    font-size:18px;
    line-height:1.7;
    max-width:560px;
}

.actions{
    display:flex;
    gap:14px;
    margin-top:35px;
    flex-wrap:wrap;
}

.primary{
    border:0;
    background:#fff;
    color:#05070c;
    padding:15px 25px;
    border-radius:30px;
    font-weight:bold;
    cursor:pointer;
}

.secondary{
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.05);
    color:white;
    padding:15px 25px;
    border-radius:30px;
    cursor:pointer;
}

/* =========================
   REAL EARTH
========================= */

.earth-stage{
    position:absolute;
    right:-8%;
    top:50%;
    transform:translateY(-50%);
    width:min(62vw,780px);
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

.earth-glow{
    position:absolute;
    width:94%;
    height:94%;
    border-radius:50%;
    background:#168dff;
    filter:blur(45px);
    opacity:.22;
    animation:pulseGlow 5s ease-in-out infinite;
}

@keyframes pulseGlow{
    0%,100%{transform:scale(.96);opacity:.18}
    50%{transform:scale(1.04);opacity:.30}
}

/*
  Real Earth texture.

  NASA Blue Marble is mapped around a sphere
  using CSS 3D layers.
*/

.earth{
    width:82%;
    height:82%;
    border-radius:50%;
    position:relative;
    overflow:hidden;
    background-image:url("assets/earth.jpg");
    background-size:auto 100%;
    background-repeat:repeat-x;

    box-shadow:
      inset -55px -10px 90px rgba(0,0,0,.9),
      inset 35px 0 55px rgba(255,255,255,.08),
      0 0 30px rgba(0,150,255,.4),
      0 0 100px rgba(0,100,255,.2);

    animation:earthRotate 24s linear infinite;
}

@keyframes earthRotate{
    from{
        background-position:0 0;
    }
    to{
        background-position:-100% 0;
    }
}
